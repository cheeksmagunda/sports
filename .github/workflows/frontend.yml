name: frontend

on:
  push:
    branches: [main]
    paths:
      - "wnba-oracle/frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "wnba-oracle/frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: wnba-oracle/frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wnba-oracle/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
