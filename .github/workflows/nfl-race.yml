name: nfl-race

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or ref to race from
        required: false
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: nfl-race
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      - name: Prefetch race inputs
        continue-on-error: true
        run: |
          if [ -f nfl-oracle/scripts/resolve_context_snapshot.py ]; then
            uv run --frozen --package nfl-oracle python nfl-oracle/scripts/resolve_context_snapshot.py \
              || echo "context snapshot absent; evaluate hook stays no-op"
          else
            echo "resolve_context_snapshot.py not on this ref yet"
          fi
          if [ -d nfl-oracle/data/race ]; then
            echo "race corpus present under nfl-oracle/data/race"
          else
            echo "race corpus absent; backup corpora (#338) not checked out"
          fi

  matrix:
    needs: prefetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      - name: Run NFL evaluate hook
        continue-on-error: true
        run: |
          uv run --frozen --package nfl-oracle python -c "
          from nfl_oracle.replay.racer import EvalContext, Variant, evaluate, race_contract_source
          slate = evaluate(Variant({'profile': 'identity'}), EvalContext())
          print(f'shard=${{ matrix.shard }} observations={len(slate.observations)} source={race_contract_source()}')
          "

  merge:
    needs: matrix
    if: ${{ !cancelled() && needs.matrix.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      - name: Merge race shards
        run: |
          uv run --frozen --package oracle-core python -c "
          from oracle_core.race import merge_shard_records
          print('merge_shard_records ready', merge_shard_records([]))
          "
