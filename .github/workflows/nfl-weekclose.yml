name: nfl-weekclose

# Sibling to nfl-dayclose.yml. Gate derives the week's final game from the
# public nflverse schedule, requires live score finalization + kickoff-relative
# 1h buffer, then runs. On the final-slate day, day-close skips (supersede),
# so this workflow grades the final slate day via the existing dayclose path,
# then runs the audit-only weekclose punch-list producer (issue #165) and
# folds its findings into the same digest posted to this run's job summary
# below. A non-empty punch list adds a warning annotation to the run; it
# never opens an issue (issue #442).

on:
  schedule:
    # Every 30 minutes during a plausible MNF / late-slate end window (UTC).
    # Exact whistle time varies; the gate decides whether to run.
    - cron: "*/30 0-8 * * 1,2"
  workflow_dispatch:
    inputs:
      as_of:
        description: Eastern calendar day (YYYY-MM-DD) to evaluate; default today Eastern
        required: false
        type: string
      now:
        description: Optional ISO-8601 clock override for the gate (tests / replay)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nfl-weekclose
  cancel-in-progress: false

jobs:
  weekclose:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      - name: Week-close gate (final game finalized + 1h buffer)
        id: gate
        # Fail open for network/schedule download issues: an unset should_run
        # is treated as false below, so a broken gate never starts work.
        continue-on-error: true
        run: |
          AS_OF_ARG=""
          if [ -n "${{ inputs.as_of }}" ]; then
            AS_OF_ARG="--as-of ${{ inputs.as_of }}"
          fi
          NOW_ARG=""
          if [ -n "${{ inputs.now }}" ]; then
            NOW_ARG="--now ${{ inputs.now }}"
          fi
          uv run --frozen --package nfl-oracle python nfl-oracle/scripts/nfl_weekclose_gate.py \
            $AS_OF_ARG \
            $NOW_ARG \
            --github-output "$GITHUB_OUTPUT"

      - name: No-op until final game is finalized + buffer elapsed
        if: steps.gate.outputs.should_run != 'true'
        run: |
          {
            echo "# NFL week-close gate wait ($(date -u +%Y-%m-%dT%H:%MZ))"
            echo
            echo "- should_run: \`${{ steps.gate.outputs.should_run || 'false' }}\`"
            echo "- reason: \`${{ steps.gate.outputs.reason || 'unset' }}\`"
            echo "- as_of: \`${{ steps.gate.outputs.as_of || '-' }}\`"
            echo "- is_final_slate_day: \`${{ steps.gate.outputs.is_final_slate_day || '-' }}\`"
            echo "- season/week: \`${{ steps.gate.outputs.season || '-' }}\` / \`${{ steps.gate.outputs.week || '-' }}\`"
            echo "- final_gameday: \`${{ steps.gate.outputs.final_gameday || '-' }}\`"
            echo "- final_game_id: \`${{ steps.gate.outputs.final_game_id || '-' }}\`"
            echo "- finalized: \`${{ steps.gate.outputs.finalized || '-' }}\`"
            echo "- buffer_elapsed: \`${{ steps.gate.outputs.buffer_elapsed || '-' }}\`"
          } | tee "$RUNNER_TEMP/weekclose-report.md"

      - name: Prepare TLS certificate
        if: steps.gate.outputs.should_run == 'true'
        env:
          NFL_PG_SSL_ROOT_CERT: ${{ secrets.NFL_PG_SSL_ROOT_CERT }}
        run: |
          umask 077
          printf '%s' "$NFL_PG_SSL_ROOT_CERT" > "$RUNNER_TEMP/nfl_pg_root.crt"

      # See the matching step/comment in nfl-dayclose.yml: the live
      # re-scrape below needs Playwright Chromium, which no GHA runner has
      # pre-installed. Root cause of issues #143 / #144.
      - name: Install Playwright Chromium
        if: steps.gate.outputs.should_run == 'true'
        run: uv run --frozen --package nfl-oracle playwright install --with-deps chromium

      - name: Grade final slate day (supersede stopgap until punch-list body)
        id: weekclose
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        env:
          NFL_DATABASE_URL: ${{ secrets.NFL_DAYCLOSE_DATABASE_URL }}
          REALSPORTS_STORAGE_STATE_B64GZ: ${{ secrets.REALSPORTS_STORAGE_STATE_B64GZ }}
          PGSSLROOTCERT: ${{ runner.temp }}/nfl_pg_root.crt
        run: |
          set -o pipefail
          if [ -z "$NFL_DATABASE_URL" ] || [ -z "$REALSPORTS_STORAGE_STATE_B64GZ" ]; then
            echo "not_configured: NFL_DAYCLOSE_DATABASE_URL and/or REALSPORTS_STORAGE_STATE_B64GZ secrets are unset" | tee "$RUNNER_TEMP/weekclose-report.md"
            exit 1
          fi
          FINAL_DAY="${{ steps.gate.outputs.final_gameday }}"
          if [ -z "$FINAL_DAY" ]; then
            echo "ALERT: gate set should_run without final_gameday" | tee "$RUNNER_TEMP/weekclose-report.md"
            exit 1
          fi
          # Live re-scrape happens inside dayclose (force-refresh contest + games).
          uv run --frozen --package nfl-oracle nfl-pipeline \
            dayclose --day "$FINAL_DAY" --catchup-window-days 1 \
            | tee "$RUNNER_TEMP/weekclose-output.json"

      - name: Build week punch list (audit-only)
        id: punchlist
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        env:
          NFL_DATABASE_URL: ${{ secrets.NFL_DAYCLOSE_DATABASE_URL }}
          PGSSLROOTCERT: ${{ runner.temp }}/nfl_pg_root.crt
        run: |
          set -o pipefail
          if [ -z "$NFL_DATABASE_URL" ]; then
            echo "not_configured: NFL_DAYCLOSE_DATABASE_URL secret is unset" | tee "$RUNNER_TEMP/weekclose-punchlist.json"
            exit 1
          fi
          # Session-free: reads existing freezes/grades/on-disk contests only,
          # never a provider network client. Never trains or retrains a model.
          uv run --frozen --package nfl-oracle nfl-pipeline \
            weekclose --season "${{ steps.gate.outputs.season }}" --week "${{ steps.gate.outputs.week }}" \
            | tee "$RUNNER_TEMP/weekclose-punchlist.json"

      - name: Build week-close digest
        if: always() && steps.gate.outputs.should_run == 'true'
        run: |
          {
            echo "# NFL week-close ($(date -u +%Y-%m-%dT%H:%MZ))"
            echo
            echo "- season/week: \`${{ steps.gate.outputs.season || '-' }}\` / \`${{ steps.gate.outputs.week || '-' }}\`"
            echo "- final_gameday: \`${{ steps.gate.outputs.final_gameday || '-' }}\`"
            echo "- final_game_id: \`${{ steps.gate.outputs.final_game_id || '-' }}\`"
            echo "- gate reason: \`${{ steps.gate.outputs.reason || '-' }}\`"
            echo
            echo "Graded final slate day via dayclose (live refresh)."
            echo
            if [ -s "$RUNNER_TEMP/weekclose-output.json" ]; then
              echo '```json'
              cat "$RUNNER_TEMP/weekclose-output.json"
              echo '```'
            else
              echo "ALERT: week-close produced no dayclose output."
              cat "$RUNNER_TEMP/weekclose-report.md" 2>/dev/null || true
            fi
            echo
            echo "## Week punch list (issue #165, audit-only, model/infra findings)"
            echo
            if [ -s "$RUNNER_TEMP/weekclose-punchlist.json" ]; then
              echo '```json'
              cat "$RUNNER_TEMP/weekclose-punchlist.json"
              echo '```'
              echo
              echo "Whistle-time proxy: nflverse scores/result + kickoff+3h+1h floor"
              echo "(exact whistle time is not in the public schedule feed)."
              echo
              echo "Findings stay in this job summary; no issue is opened (issue #442)."
              echo "Findings are inputs to the issue/PR flow and do not change models on their own."
            else
              echo "ALERT: week punch list producer did not run or produced no output."
            fi
          } > "$RUNNER_TEMP/weekclose-report.md"

      # Reporting only: a non-empty punch list is an audit finding, not a job
      # failure, so it annotates the run with a warning and leaves the pass or
      # fail decision to the ledger step below, unchanged.
      - name: Annotate punch-list findings on the run
        if: always() && steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        env:
          SEASON: ${{ steps.gate.outputs.season }}
          WEEK: ${{ steps.gate.outputs.week }}
        run: |
          PUNCH="$RUNNER_TEMP/weekclose-punchlist.json"
          if [ ! -s "$PUNCH" ]; then
            exit 0
          fi
          COUNT=$(jq '.punch_list | length' "$PUNCH" 2>/dev/null || echo 0)
          RESOLVED=$(jq -r '.resolved // false' "$PUNCH" 2>/dev/null || echo false)
          if [ "$RESOLVED" = "true" ] && [ "$COUNT" != "0" ]; then
            echo "::warning title=NFL week punch list::${COUNT} finding(s) for ${SEASON}-W${WEEK}; see the job summary."
          fi

      - uses: ./.github/actions/dayclose-ledger
        if: always() && steps.gate.outputs.should_run == 'true'
        with:
          results_title: "NFL results ledger"
          report_path: ${{ runner.temp }}/weekclose-report.md
          should_escalate: ${{ (steps.weekclose.outcome != 'success' || steps.punchlist.outcome != 'success') && 'true' || 'false' }}
