name: corpus-backup

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:
    inputs:
      confirm_backup:
        description: Confirm that this manual run may write the backups branch
        required: true
        type: boolean
        default: false
      allow_regression:
        description: Allow an intentional row-count or maximum-slate regression
        required: false
        type: boolean
        default: false
      publish_race_corpus:
        description: Also build and publish the WNBA race corpus under wnba-oracle/data/race/ (Refs #337)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: corpus-backup
  cancel-in-progress: false

jobs:
  export:
    permissions:
      contents: read
    if: github.event_name == 'schedule' || inputs.confirm_backup == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      - name: Prepare TLS certificate
        env:
          PG_SSL_ROOT_CERT: ${{ secrets.PG_SSL_ROOT_CERT }}
        run: |
          umask 077
          printf '%s' "$PG_SSL_ROOT_CERT" > "$RUNNER_TEMP/pg_root.crt"

      - name: Load previous backup baseline
        env:
          PREVIOUS_MANIFEST: ${{ runner.temp }}/previous-manifest.json
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/backups; then
            git show origin/backups:wnba-oracle/data/backups/manifest.json > "$PREVIOUS_MANIFEST"
          fi

      - name: Export corpus snapshot
        env:
          CORPUS_BACKUP_ALLOW_REGRESSION: ${{ inputs.allow_regression || false }}
          CORPUS_BACKUP_DIR: ${{ runner.temp }}/corpus-backup
          CORPUS_PREVIOUS_MANIFEST: ${{ runner.temp }}/previous-manifest.json
          DATABASE_PUBLIC_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PGSSLROOTCERT: ${{ runner.temp }}/pg_root.crt
        run: uv run --frozen --package wnba-oracle python wnba-oracle/scripts/backup_corpus.py

      - name: Verify snapshot manifest and hashes
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/corpus-backup
        run: uv run --frozen --package wnba-oracle python wnba-oracle/scripts/restore_corpus.py --snapshot-dir "$SNAPSHOT_DIR"

      - name: Transfer verified snapshot without database credentials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/corpus-backup/slate_labels.csv
            ${{ runner.temp }}/corpus-backup/contest_leaderboards.csv
            ${{ runner.temp }}/corpus-backup/manifest.json
          if-no-files-found: error
          retention-days: 1

      # Race corpus publish is opt-in via workflow_dispatch until the full
      # builder replaces the schema-only stub (Refs #337). Scheduled runs skip.
      - name: Build race corpus (per-season parquet)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_race_corpus == true
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PGSSLROOTCERT: ${{ runner.temp }}/pg_root.crt
        run: >
          uv run --frozen --package wnba-oracle python
          wnba-oracle/scripts/build_race_corpus.py --seasons all
          --out "$RUNNER_TEMP/race-corpus/wnba"

      - name: Enforce race corpus per-file size budget
        if: github.event_name == 'workflow_dispatch' && inputs.publish_race_corpus == true
        run: |
          big=$(find "$RUNNER_TEMP/race-corpus" -name '*.parquet' -size +100M -print)
          if [ -n "$big" ]; then
            echo "race parquet over 100MB:"
            echo "$big"
            exit 1
          fi

      - name: Verify race manifest and hashes
        if: github.event_name == 'workflow_dispatch' && inputs.publish_race_corpus == true
        run: >
          uv run --frozen --package wnba-oracle python
          wnba-oracle/scripts/build_race_corpus.py --verify-only
          --out "$RUNNER_TEMP/race-corpus/wnba"

      - name: Transfer verified race corpus without database credentials
        if: github.event_name == 'workflow_dispatch' && inputs.publish_race_corpus == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: race-corpus-${{ github.run_id }}
          path: ${{ runner.temp }}/race-corpus
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: export
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      - name: Download verified snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corpus-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/corpus-backup

      - name: Reverify transferred snapshot before repository write
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/corpus-backup
        run: uv run --frozen --package wnba-oracle python wnba-oracle/scripts/restore_corpus.py --snapshot-dir "$SNAPSHOT_DIR"

      - name: Download verified race corpus
        if: github.event_name == 'workflow_dispatch' && inputs.publish_race_corpus == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: race-corpus-${{ github.run_id }}
          path: ${{ runner.temp }}/race-corpus

      - name: Reverify race corpus before repository write
        if: github.event_name == 'workflow_dispatch' && inputs.publish_race_corpus == true
        run: >
          uv run --frozen --package wnba-oracle python
          wnba-oracle/scripts/build_race_corpus.py --verify-only
          --out "$RUNNER_TEMP/race-corpus/wnba"

      - name: Commit snapshot to backups branch
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_DIR: ${{ runner.temp }}/corpus-backup
          RACE_DIR: ${{ runner.temp }}/race-corpus/wnba
          PUBLISH_RACE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_race_corpus == true }}
        run: |
          gh auth setup-git
          git config user.name "wnba-oracle-bot"
          git config user.email "noreply@github.com"
          if git ls-remote --exit-code --heads origin backups >/dev/null 2>&1; then
            git fetch origin backups
            git switch --force-create backups origin/backups
          else
            git switch --orphan backups
            git rm -r --cached . || true
          fi
          mkdir -p wnba-oracle/data/backups
          cp "$SNAPSHOT_DIR/slate_labels.csv" wnba-oracle/data/backups/
          cp "$SNAPSHOT_DIR/contest_leaderboards.csv" wnba-oracle/data/backups/
          cp "$SNAPSHOT_DIR/manifest.json" wnba-oracle/data/backups/
          git add -f wnba-oracle/data/backups/slate_labels.csv
          git add -f wnba-oracle/data/backups/contest_leaderboards.csv
          git add -f wnba-oracle/data/backups/manifest.json
          if [ "$PUBLISH_RACE" = "true" ]; then
            mkdir -p wnba-oracle/data/race/wnba
            # Replace prior race tree so removed seasons do not linger.
            rm -rf wnba-oracle/data/race/wnba
            mkdir -p wnba-oracle/data/race/wnba
            cp -R "$RACE_DIR"/. wnba-oracle/data/race/wnba/
            git add -f wnba-oracle/data/race
          fi
          if git diff --cached --quiet; then
            echo "no corpus changes; skipping commit"
          else
            git commit -m "backup: corpus snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin backups
          fi
          # The orphan `backups` branch has no .github/actions tree. Composite
          # action post steps (setup-python-uv) resolve that path from the
          # worktree and fail the job even after a successful push. Return to
          # the triggering ref before the job ends (same class as NFL #172,
          # ported here for #202).
          git switch --detach "$GITHUB_SHA"
