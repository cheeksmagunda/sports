name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "packages/oracle-core/**"
      - "wnba-oracle/src/**"
      - "wnba-oracle/tests/**"
      - "wnba-oracle/scripts/**"
      - "wnba-oracle/migrations/**"
      - "wnba-oracle/pyproject.toml"
      - "wnba-oracle/Makefile"
      - "wnba-oracle/README.md"
      - "wnba-oracle/alembic.ini"
      - "wnba-oracle/Dockerfile"
      - "wnba-oracle/railway.toml"
      - "wnba-oracle/models/**"
      - "wnba-oracle/data/**"
      - ".dockerignore"
      - ".gitleaksignore"
      - ".gitleaks.toml"
      - "scripts/check_import_boundaries.py"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "packages/oracle-core/**"
      - "wnba-oracle/src/**"
      - "wnba-oracle/tests/**"
      - "wnba-oracle/scripts/**"
      - "wnba-oracle/migrations/**"
      - "wnba-oracle/pyproject.toml"
      - "wnba-oracle/Makefile"
      - "wnba-oracle/README.md"
      - "wnba-oracle/alembic.ini"
      - "wnba-oracle/Dockerfile"
      - "wnba-oracle/railway.toml"
      - "wnba-oracle/models/**"
      - "wnba-oracle/data/**"
      - ".dockerignore"
      - ".gitleaksignore"
      - ".gitleaks.toml"
      - "scripts/check_import_boundaries.py"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/dependabot.yml"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          cache: false
          go-version: "1.26.x"

      - name: Install pinned gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0

      - name: Scan tracked history with redaction
        run: >-
          "$(go env GOPATH)/bin/gitleaks"
          git --redact --config .gitleaks.toml --log-opts="--all"

  test-and-quality:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          version: "0.11.13"

      - name: Verify workspace lock
        run: uv lock --check

      - name: Install workspace
        run: uv sync --frozen --all-packages --all-extras

      # The Makefile owns the audit command and narrow reachability exceptions.
      # Revisit every ignore if the API begins exposing the affected Arrow or
      # Starlette request, form, static-file, or HTTPEndpoint surfaces.
      - name: Audit runtime dependencies and backend security
        run: make security

      - name: Test oracle-core
        run: make test-core

      - name: Test WNBA backend
        run: make test-wnba

      - name: Lint backend workspace
        run: make lint

      - name: Typecheck backend workspace
        run: make typecheck

      - name: Enforce package import boundaries
        run: make check-boundaries

      - name: Build Python packages
        run: make build

  integration-and-container:
    needs: test-and-quality
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wnba
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: wnba
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          version: "0.11.13"

      - name: Install backend workspace
        run: uv sync --frozen --all-packages --all-extras

      - name: Test migrations, PostgreSQL, and Redis
        run: make test-integration

      - name: Build WNBA backend image
        run: docker build -t wnba-oracle:ci -f wnba-oracle/Dockerfile .

      - name: Smoke every cron role in the built image
        run: |
          for role in job1 job1games job1late job2 dayclose backfill; do
            docker run --rm \
              -e WNBA_CRON_ROLE="$role" \
              wnba-oracle:ci \
              python scripts/runtime_role_probe.py --job "$role"
          done
          if docker run --rm \
            -e WNBA_CRON_ROLE=job2 \
            wnba-oracle:ci \
            python scripts/runtime_role_probe.py --job job1; then
            echo "runtime role mismatch was accepted" >&2
            exit 1
          fi

      - name: Smoke API startup, migrations, PostgreSQL, and Redis
        run: |
          container_id=$(docker run -d \
            --network host \
            -e DATABASE_URL \
            -e REDIS_URL \
            -e PORT=18000 \
            wnba-oracle:ci)
          cleanup() {
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container_id"
          exit 1
