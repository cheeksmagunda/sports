name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "packages/oracle-core/**"
      - "*-oracle/**"
      - ".dockerignore"
      - ".gitleaksignore"
      - ".gitleaks.toml"
      - "scripts/check_import_boundaries.py"
      - "scripts/check_applications.py"
      - "APPLICATION_GUIDE.md"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".devcontainer/**"
      - "scripts/**"
  pull_request:
    paths:
      - "packages/oracle-core/**"
      - "*-oracle/**"
      - ".dockerignore"
      - ".gitleaksignore"
      - ".gitleaks.toml"
      - "scripts/check_import_boundaries.py"
      - "scripts/check_applications.py"
      - "APPLICATION_GUIDE.md"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".devcontainer/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          cache: false
          go-version: "1.26.x"

      - name: Install pinned gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0

      - name: Scan tracked history with redaction
        run: >-
          "$(go env GOPATH)/bin/gitleaks"
          git --redact --config .gitleaks.toml --log-opts="--all"

  test-and-quality:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      # The Makefile owns the audit command and narrow reachability exceptions.
      # Revisit every ignore if the API begins exposing the affected Arrow or
      # Starlette request, form, static-file, or HTTPEndpoint surfaces.
      - name: Audit runtime dependencies and backend security
        run: make security

      - name: Test oracle-core
        run: make test-core

      - name: Test portfolio tooling
        run: make test-portfolio

      - name: Test WNBA backend
        run: make test-wnba

      - name: Lint backend workspace
        run: make lint

      - name: Typecheck backend workspace
        run: make typecheck

      - name: Enforce package import boundaries
        run: make check-boundaries

      - name: Enforce sport application contracts
        run: make check-applications

      - name: Build Python packages
        run: make build

  integration-and-container:
    needs: test-and-quality
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wnba
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: wnba
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      - name: Test migrations, PostgreSQL, and Redis
        run: make test-integration

      - name: Build WNBA backend image
        run: docker build -t wnba-oracle:ci -f wnba-oracle/Dockerfile .

      - name: Smoke every cron role in the built image
        run: |
          for role in job1 job1games job1late job2 dayclose backfill; do
            docker run --rm \
              -e WNBA_CRON_ROLE="$role" \
              wnba-oracle:ci \
              python scripts/runtime_role_probe.py --job "$role"
          done
          if docker run --rm \
            -e WNBA_CRON_ROLE=job2 \
            wnba-oracle:ci \
            python scripts/runtime_role_probe.py --job job1; then
            echo "runtime role mismatch was accepted" >&2
            exit 1
          fi

      - name: Smoke API startup, migrations, PostgreSQL, and Redis
        run: |
          container_id=$(docker run -d \
            --network host \
            -e DATABASE_URL \
            -e REDIS_URL \
            -e PORT=18000 \
            wnba-oracle:ci)
          cleanup() {
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container_id"
          exit 1

  devcontainer-smoke:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Build the Codespaces environment and run post-create setup
        run: npx --yes --package @devcontainers/cli@0.88.0 devcontainer up --workspace-folder . --frozen-lockfile

      - name: Verify portable services and migrations in the devcontainer
        run: >-
          npx --yes --package @devcontainers/cli@0.88.0 devcontainer exec
          --workspace-folder . make test-core test-portfolio test-integration
