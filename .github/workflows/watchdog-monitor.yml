name: watchdog-monitor

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  ALERT_LABEL: ops-guard
  WATCHDOG_TITLE: WNBA Oracle watchdog alert
  WNBA_API_BASE: https://api-production-7033.up.railway.app
  WNBA_FRONTEND_URL: https://frontend-production-a739.up.railway.app
  WATCHDOG_HEARTBEAT_URL: ${{ secrets.WATCHDOG_HEARTBEAT_URL }}

concurrency:
  group: watchdog-monitor
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Probe production
        id: probe
        continue-on-error: true
        run: >-
          python wnba-oracle/scripts/watchdog_monitor.py
          --report "$RUNNER_TEMP/watchdog-report.md"

      - name: Ensure an incident-safe report exists
        if: always()
        run: |
          if [ ! -s "$RUNNER_TEMP/watchdog-report.md" ]; then
            printf '# WNBA Oracle watchdog\n\n- ALERT: the production probe did not produce a report.\n' > "$RUNNER_TEMP/watchdog-report.md"
          fi

      - name: Open one issue per incident
        if: always() && (steps.probe.outcome != 'success' || steps.probe.outputs.status == 'alert')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$ALERT_LABEL" --color B60205 --description "Live watchdog alert" 2>/dev/null || true
          number=$(gh issue list --label "$ALERT_LABEL" --state open --json number,title \
            --jq '.[] | select(.title == "WNBA Oracle watchdog alert") | .number' | head -n 1)
          if [ -z "$number" ]; then
            gh issue create \
              --label "$ALERT_LABEL" \
              --title "$WATCHDOG_TITLE" \
              --body-file "$RUNNER_TEMP/watchdog-report.md"
          fi

      - name: Close incident on recovery
        if: always() && steps.probe.outcome == 'success' && steps.probe.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh issue list --label "$ALERT_LABEL" --state open --json number,title \
            --jq '.[] | select(.title == "WNBA Oracle watchdog alert") | .number'); do
            gh issue comment "$number" --body "Production recovered at $(date -u +'%F %T') UTC."
            gh issue close "$number"
          done

      - name: Fail an unhealthy monitor after escalation
        if: always() && (steps.probe.outcome != 'success' || steps.probe.outputs.status == 'alert')
        run: exit 1
