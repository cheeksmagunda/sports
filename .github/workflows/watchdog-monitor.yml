name: watchdog-monitor

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  WATCHDOG_TITLE: WNBA Oracle watchdog alert
  WNBA_API_BASE: https://api-production-7033.up.railway.app
  WNBA_FRONTEND_URL: https://frontend-production-a739.up.railway.app
  WATCHDOG_HEARTBEAT_URL: ${{ secrets.WATCHDOG_HEARTBEAT_URL }}

concurrency:
  group: watchdog-monitor
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      # Captures stdout+stderr regardless of outcome so a crash (as opposed
      # to a real alert) is diagnosable from the run instead of vanishing;
      # `set -o pipefail` is required or `tee`'s own exit code (0) would
      # mask a real probe failure, the same class of bug already fixed for
      # nfl-dayclose (see its "Exit code" STATUS.md entry, issue #149).
      - name: Probe production
        id: probe
        continue-on-error: true
        run: |
          set -o pipefail
          uv run --frozen --package wnba-oracle python wnba-oracle/scripts/watchdog_monitor.py \
            --report "$RUNNER_TEMP/watchdog-report.md" 2>&1 | tee "$RUNNER_TEMP/watchdog-probe.log"

      - name: Ensure an incident-safe report exists
        if: always()
        run: |
          if [ ! -s "$RUNNER_TEMP/watchdog-report.md" ]; then
            {
              echo "# WNBA Oracle watchdog"
              echo
              echo "- ALERT: the production probe did not produce a report."
              echo
              echo '```'
              tail -n 50 "$RUNNER_TEMP/watchdog-probe.log" 2>/dev/null || echo "(no probe output captured)"
              echo '```'
            } > "$RUNNER_TEMP/watchdog-report.md"
          fi

      # Tracked separately from a real production alert below: a probe crash
      # is a monitor-health problem, not evidence WNBA production is down,
      # and must not block resolving (or fabricate) a real alert either way.
      #
      # Deliberately keyed on `steps.probe.outputs.status` being empty, not
      # on `steps.probe.outcome`: the script's own exit code is 1 for BOTH a
      # crash and a legitimate `status=alert` finding (same exit code, two
      # different meanings), so `outcome` alone cannot tell them apart. The
      # GITHUB_OUTPUT write only happens once `main()` runs to completion, so
      # an empty `status` output is the actual "did not finish" signal.
      - uses: ./.github/actions/dayclose-ledger
        if: always()
        with:
          results_title: "WNBA watchdog probe log"
          guard_label: ops-guard-probe
          guard_title: "WNBA watchdog probe failure"
          report_path: ${{ runner.temp }}/watchdog-report.md
          should_escalate: ${{ steps.probe.outputs.status == '' && 'true' || 'false' }}

      - uses: ./.github/actions/dayclose-ledger
        if: always() && steps.probe.outputs.status != ''
        with:
          results_title: "WNBA Oracle watchdog alert log"
          guard_label: ops-guard
          guard_title: ${{ env.WATCHDOG_TITLE }}
          report_path: ${{ runner.temp }}/watchdog-report.md
          should_escalate: ${{ steps.probe.outputs.status == 'alert' && 'true' || 'false' }}
