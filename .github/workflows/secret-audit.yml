name: secret-audit

# Manual, read-only. Prints sha256[:8] of each configured secret so an
# operator or agent can confirm an Actions copy matches its Railway source
# (compare by hash; never by value) without ever printing the value itself.
# Closes the propagation-verification need from issue #242 and the optional
# Actions/Railway hash-parity item from issue #239.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hash configured secrets (value-free)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          REALSPORTS_STORAGE_STATE_B64GZ: ${{ secrets.REALSPORTS_STORAGE_STATE_B64GZ }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os

          for name in ("ODDS_API_KEY", "REALSPORTS_STORAGE_STATE_B64GZ"):
              value = os.environ.get(name, "").strip()
              if value:
                  digest = hashlib.sha256(value.encode()).hexdigest()[:8]
                  print(f"{name}: configured sha256[:8]={digest}")
              else:
                  print(f"{name}: not configured")
          PY
