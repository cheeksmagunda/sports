name: wnba-dayclose-verify

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      slate_date:
        description: WNBA slate date that the day-close run should have processed
        required: true
        type: string
      run_start_utc:
        description: Inclusive ISO-8601 UTC start for the expected Railway run
        required: true
        type: string
      run_end_utc:
        description: Inclusive ISO-8601 UTC end for the expected Railway run
        required: true
        type: string

permissions:
  contents: read

env:
  RESULTS_LABEL: ops-results
  GUARD_LABEL: ops-guard
  WNBA_API_BASE: https://api-production-7033.up.railway.app

concurrency:
  group: wnba-dayclose-verify
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      - name: Resolve run window
        env:
          MANUAL_RUN_END_UTC: ${{ inputs.run_end_utc }}
          MANUAL_RUN_START_UTC: ${{ inputs.run_start_utc }}
          MANUAL_SLATE_DATE: ${{ inputs.slate_date }}
        run: >-
          uv run --frozen --package wnba-oracle python wnba-oracle/scripts/resolve_ops_window.py
          --role dayclose
          --github-env "$GITHUB_ENV"

      - name: Verify day-close
        id: verify
        continue-on-error: true
        run: >-
          uv run --frozen --package wnba-oracle python wnba-oracle/scripts/dayclose_verify.py
          --slate-date "$INPUT_SLATE_DATE"
          --run-start-utc "$INPUT_RUN_START_UTC"
          --run-end-utc "$INPUT_RUN_END_UTC"
          --report "$RUNNER_TEMP/dayclose-report.md"

      - name: Ensure an incident-safe report exists
        if: always()
        run: |
          if [ ! -s "$RUNNER_TEMP/dayclose-report.md" ]; then
            printf '# WNBA day-close verification\n\n- ALERT: verification did not produce a report.\n' > "$RUNNER_TEMP/dayclose-report.md"
          fi

      - name: Append results digest
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$RESULTS_LABEL" --color 1D76DB --description "WNBA results ledger" 2>/dev/null || true
          number=$(gh issue list --label "$RESULTS_LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/dayclose-report.md"
          else
            gh issue create \
              --label "$RESULTS_LABEL" \
              --title "WNBA results ledger" \
              --body-file "$RUNNER_TEMP/dayclose-report.md"
          fi

      - name: Escalate day-close failure
        if: always() && (steps.verify.outcome != 'success' || steps.verify.outputs.status == 'alert')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$GUARD_LABEL" --color B60205 --description "WNBA production operations" 2>/dev/null || true
          number=$(gh issue list --label "$GUARD_LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/dayclose-report.md"
          else
            gh issue create \
              --label "$GUARD_LABEL" \
              --title "WNBA production operations" \
              --body-file "$RUNNER_TEMP/dayclose-report.md"
          fi

      - name: Fail unhealthy verification after escalation
        if: always() && (steps.verify.outcome != 'success' || steps.verify.outputs.status == 'alert')
        run: exit 1
