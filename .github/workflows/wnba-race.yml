name: wnba-race

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or ref to race from
        required: false
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: wnba-race
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      - name: Prefetch race inputs
        continue-on-error: true
        run: |
          if [ -d wnba-oracle/data/race ] || [ -d data/race ]; then
            echo "WNBA race corpus present"
          else
            echo "WNBA race corpus absent; backup corpora (#337) not checked out"
          fi

  matrix:
    needs: prefetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      - name: Run WNBA evaluate hook
        continue-on-error: true
        run: |
          uv run --frozen --package wnba-oracle python -c "
          from wnba_oracle.eval.racer import EvalContext, Variant, evaluate, race_contract_source
          slate = evaluate(Variant({'profile': 'identity'}), EvalContext())
          print(f'shard=${{ matrix.shard }} observations={len(slate.observations)} source={race_contract_source()}')
          "

  merge:
    needs: matrix
    if: ${{ !cancelled() && needs.matrix.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      - name: Merge race shards
        run: |
          uv run --frozen --package oracle-core python -c "
          from oracle_core.race import merge_shard_records
          print('merge_shard_records ready', merge_shard_records([]))
          "
