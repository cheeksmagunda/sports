name: backend-contracts

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backend-contracts
  cancel-in-progress: false

jobs:
  external-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      - name: Check live provider schemas
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: >-
          uv run --frozen --package wnba-oracle python -m pytest
          wnba-oracle/tests -m contract -v
