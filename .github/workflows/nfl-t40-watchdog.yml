name: nfl-t40-watchdog

on:
  schedule:
    # NFL kickoff windows only (UTC). T-40 for 1pm/4pm ET Sunday games falls
    # at 16:20 and 19:25-19:45; SNF/MNF/TNF T-40 falls 23:35-23:40; the 9:30am
    # ET international window falls at 13:50. Off-window polling would burn
    # Actions minutes for nothing; workflow_dispatch covers odd kickoffs.
    - cron: "*/15 13-14 * * 0"
    - cron: "*/15 16-21 * * 0"
    - cron: "*/15 23 * * 0,1,4"
    - cron: "*/15 0 * * 1,2,5"
    # Holiday afternoon/evening kickoffs (UTC), after US DST ends (EST).
    # 1pm ET is 18:00Z then, so T-40 is 17:20Z. 4:30pm ET T-40 is ~20:50Z.
    # Late windows spill into the next UTC hour (see spillover crons).
    # During EDT, 1pm ET T-40 is 16:20Z; the weekly Saturday cron starts at
    # hour 16 so that window is not missed. These dated EST holidays stay
    # on hour 17.
    - cron: "*/15 17-22 26 11 *" # Thanksgiving 2026-11-26
    - cron: "*/15 0-1 27 11 *"
    - cron: "*/15 17-22 19 12 *" # Saturday 2026-12-19
    - cron: "*/15 0-1 20 12 *"
    - cron: "*/15 17-22 25 12 *" # Christmas 2026-12-25
    - cron: "*/15 0-1 26 12 *"
    - cron: "*/15 17-22 * * 4"
    - cron: "*/15 16-22 * * 6"
    - cron: "*/15 0-1 * * 5,0"
  workflow_dispatch:
    inputs:
      day:
        description: Slate date (YYYY-MM-DD) to inspect; default is today in US/Eastern
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nfl-t40-watchdog
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      - name: Run T-40 watchdog
        id: watchdog
        continue-on-error: true
        env:
          NFL_DATABASE_URL: ${{ secrets.NFL_DAYCLOSE_DATABASE_URL }}
          NFL_PG_SSL_ROOT_CERT: ${{ secrets.NFL_PG_SSL_ROOT_CERT }}
        run: |
          if [ -z "$NFL_DATABASE_URL" ] || [ -z "$NFL_PG_SSL_ROOT_CERT" ]; then
            {
              echo "# NFL T-40 watchdog ($(date -u +%Y-%m-%dT%H:%MZ))"
              echo
              echo "- status: \`not_configured\`"
              echo "- reason: \`NFL_DAYCLOSE_DATABASE_URL and/or NFL_PG_SSL_ROOT_CERT secret unset\`"
            } > "$RUNNER_TEMP/t40-watchdog-report.md"
            echo "status=not_configured" >> "$GITHUB_OUTPUT"
            echo "reason=missing_secret" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$NFL_PG_SSL_ROOT_CERT" > "$RUNNER_TEMP/nfl_pg_root.crt"
          DAY_ARG=""
          if [ -n "${{ inputs.day }}" ]; then
            DAY_ARG="--day ${{ inputs.day }}"
          fi
          PGSSLROOTCERT="$RUNNER_TEMP/nfl_pg_root.crt" \
            uv run --frozen --package nfl-oracle python nfl-oracle/scripts/nfl_t40_watchdog.py \
            $DAY_ARG \
            --report "$RUNNER_TEMP/t40-watchdog-report.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Ensure an incident-safe report exists
        if: always()
        run: |
          if [ ! -s "$RUNNER_TEMP/t40-watchdog-report.md" ]; then
            printf '# NFL T-40 watchdog\n\n- status: `error`\n- reason: `watchdog_report_missing`\n' > "$RUNNER_TEMP/t40-watchdog-report.md"
          fi

      # The run itself is the signal (issue #442): the report goes to this
      # run's job summary, and a missed freeze or a watchdog error fails the
      # run. A `not_configured` report stays green, as before.
      - uses: ./.github/actions/dayclose-ledger
        if: always()
        with:
          results_title: "NFL T-40 watchdog"
          report_path: ${{ runner.temp }}/t40-watchdog-report.md
          should_escalate: >-
            ${{ (steps.watchdog.outcome != 'success' || steps.watchdog.outputs.status == 'alert') && 'true' || 'false' }}
