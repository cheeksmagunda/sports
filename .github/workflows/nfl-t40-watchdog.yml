name: nfl-t40-watchdog

on:
  schedule:
    # NFL kickoff windows only (UTC). T-40 for 1pm/4pm ET Sunday games falls
    # at 16:20 and 19:25-19:45; SNF/MNF/TNF T-40 falls 23:35-23:40; the 9:30am
    # ET international window falls at 13:50. Off-window polling would burn
    # Actions minutes for nothing; workflow_dispatch covers odd kickoffs.
    #
    # Holiday gaps the weekly Sun/TNF/MNF grid misses (EST = UTC-5):
    # - Thanksgiving Thu afternoon: 1pm/4:30pm ET T-40 (17:20 / 20:50 UTC);
    #   evening TNF already covered by the 23:00 Thu + 00:00 Fri crons.
    # - Late-season Saturday (e.g. 2026-12-19): 5pm/8:20pm ET T-40
    #   (21:20 UTC Sat / 00:40 UTC Sun).
    # - Christmas Day (e.g. 2026-12-25): 1pm/4:30pm/8:15pm ET T-40
    #   (17:20 / 20:50 UTC / 00:35 UTC next day).
    - cron: "*/15 13-14 * * 0"
    - cron: "*/15 16-21 * * 0"
    - cron: "*/15 23 * * 0,1,4"
    - cron: "*/15 0 * * 1,2,5"
    # Thanksgiving Thursday afternoon (November Thursdays only).
    - cron: "*/15 17-21 * 11 4"
    # Late-season Saturday (December Saturdays) + Sunday 00 UTC spillover.
    - cron: "*/15 21-23 * 12 6"
    - cron: "*/15 0 * 12 0"
    # Christmas Day afternoon + next-day 00 UTC spillover for the nightcap.
    - cron: "*/15 17-21 25 12 *"
    - cron: "*/15 0 26 12 *"
  workflow_dispatch:
    inputs:
      day:
        description: Slate date (YYYY-MM-DD) to inspect; default is today in US/Eastern
        required: false
        type: string

permissions:
  contents: read

env:
  ALERT_LABEL: nfl-ops-guard
  WATCHDOG_TITLE: NFL T-40 watchdog alert

concurrency:
  group: nfl-t40-watchdog
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      - name: Run T-40 watchdog
        id: watchdog
        continue-on-error: true
        env:
          NFL_DATABASE_URL: ${{ secrets.NFL_DAYCLOSE_DATABASE_URL }}
          NFL_PG_SSL_ROOT_CERT: ${{ secrets.NFL_PG_SSL_ROOT_CERT }}
        run: |
          if [ -z "$NFL_DATABASE_URL" ] || [ -z "$NFL_PG_SSL_ROOT_CERT" ]; then
            {
              echo "# NFL T-40 watchdog ($(date -u +%Y-%m-%dT%H:%MZ))"
              echo
              echo "- status: \`not_configured\`"
              echo "- reason: \`NFL_DAYCLOSE_DATABASE_URL and/or NFL_PG_SSL_ROOT_CERT secret unset\`"
            } > "$RUNNER_TEMP/t40-watchdog-report.md"
            echo "status=not_configured" >> "$GITHUB_OUTPUT"
            echo "reason=missing_secret" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$NFL_PG_SSL_ROOT_CERT" > "$RUNNER_TEMP/nfl_pg_root.crt"
          DAY_ARG=""
          if [ -n "${{ inputs.day }}" ]; then
            DAY_ARG="--day ${{ inputs.day }}"
          fi
          PGSSLROOTCERT="$RUNNER_TEMP/nfl_pg_root.crt" \
            uv run --frozen --package nfl-oracle python nfl-oracle/scripts/nfl_t40_watchdog.py \
            $DAY_ARG \
            --report "$RUNNER_TEMP/t40-watchdog-report.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Ensure an incident-safe report exists
        if: always()
        run: |
          if [ ! -s "$RUNNER_TEMP/t40-watchdog-report.md" ]; then
            printf '# NFL T-40 watchdog\n\n- status: `error`\n- reason: `watchdog_report_missing`\n' > "$RUNNER_TEMP/t40-watchdog-report.md"
          fi

      - name: Open or update incident issue
        if: always() && (steps.watchdog.outcome != 'success' || steps.watchdog.outputs.status == 'alert')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$ALERT_LABEL" --color B60205 --description "Production operations" 2>/dev/null || true
          number=$(gh issue list --label "$ALERT_LABEL" --state open --json number,title \
            --jq '.[] | select(.title == "NFL T-40 watchdog alert") | .number' | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/t40-watchdog-report.md"
          else
            gh issue create \
              --label "$ALERT_LABEL" \
              --title "$WATCHDOG_TITLE" \
              --body-file "$RUNNER_TEMP/t40-watchdog-report.md"
          fi

      - name: Close incident when the deadline is healthy again
        if: always() && steps.watchdog.outcome == 'success' && steps.watchdog.outputs.status != 'alert'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh issue list --label "$ALERT_LABEL" --state open --json number,title \
            --jq '.[] | select(.title == "NFL T-40 watchdog alert") | .number'); do
            gh issue comment "$number" --body "T-40 watchdog is clear as of $(date -u +'%F %T') UTC."
            gh issue close "$number"
          done

      - name: Fail after escalation
        if: always() && (steps.watchdog.outcome != 'success' || steps.watchdog.outputs.status == 'alert')
        run: exit 1
