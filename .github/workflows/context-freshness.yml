name: Context freshness

on:
  push:
    branches:
      - main
    paths:
      - AGENTS.md
      - README.md
      - ENTRY_POINTS.md
      - OVERVIEW.md
      - FILES.md
      - Makefile
      - pyproject.toml
      - .devcontainer/**
      - .github/workflows/**
      - "**/AGENTS.md"
      - "**/README.md"
      - "**/STATUS.md"
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

# The run itself is the signal (issue #442): it lists the changed
# sync-critical files in its job summary and a notice annotation. It never
# opens or updates an issue, so it needs no issues permission.
permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changes to sync-critical files
        id: changes
        run: |
          set -eu
          paths=(AGENTS.md README.md ENTRY_POINTS.md OVERVIEW.md FILES.md Makefile pyproject.toml .devcontainer .github/workflows ':(glob)**/AGENTS.md' ':(glob)**/README.md' ':(glob)**/STATUS.md')
          if [ "${{ github.event_name }}" = "push" ]; then
            summary=$(git log "${{ github.event.before }}..${{ github.sha }}" --format='%h %ad %s' --date=short -- "${paths[@]}" || true)
            files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- "${paths[@]}" || true)
          else
            since=$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)
            summary=$(git log --since="$since" --format='%h %ad %s' --date=short -- "${paths[@]}" || true)
            files=$(git log --since="$since" --name-only --format= -- "${paths[@]}" | sort -u || true)
          fi
          if [ -z "$summary" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            delim="CONTEXT_FRESHNESS_$(date +%s%N)"
            {
              echo "changed=true"
              echo "summary<<${delim}"
              echo "$summary"
              echo "${delim}"
              echo "files<<${delim}"
              echo "$files"
              echo "${delim}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Report changed sync-critical files in the job summary
        env:
          CHANGED: ${{ steps.changes.outputs.changed }}
          SUMMARY: ${{ steps.changes.outputs.summary }}
          FILES: ${{ steps.changes.outputs.files }}
        run: |
          set -eu
          {
            echo "## Context freshness"
            echo
            if [ "$CHANGED" != "true" ]; then
              echo "No sync-critical files changed in this window; static snapshots need no refresh."
            else
              echo 'Sync-critical files changed on `main`:'
              echo
              echo '```'
              echo "$FILES"
              echo '```'
              echo
              echo "Commits:"
              echo
              echo '```'
              echo "$SUMMARY"
              echo '```'
              echo
              echo 'Per the Context synchronization section of `AGENTS.md`:'
              echo
              echo "1. Refresh the changed files in every configured Claude, Codex, Copilot, and Grok static project or chat snapshot."
              echo '2. Confirm each project instruction prompt still matches the live `AGENTS.md`.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHANGED" = "true" ]; then
            count=$(printf '%s\n' "$FILES" | grep -c . || true)
            echo "::notice title=Context freshness::${count} sync-critical file(s) changed; refresh the static AI project snapshots listed in this run's job summary."
          fi
