name: Codespace maintenance sweep

# Codespace-local upkeep (health ping + prune-merged-branches, see #220/#221)
# only runs via postStartCommand, i.e. only when someone has the codespace
# open. A codespace idle for days accumulates worktree/branch sprawl
# unnoticed. This sweep wakes it briefly on a schedule so postStart fires on
# its own, then puts it back to sleep.
#
# Safety property: only ever touches a codespace already in "Shutdown"
# state. A codespace currently "Available" means someone is using it right
# now, and this workflow never starts, stops, or otherwise touches it.
#
# Requires a repo secret CODESPACES_PAT: a token scoped to `codespace` only
# (fine-grained PAT with Codespaces: write, or classic PAT with the
# `codespace` scope) for the account that owns the codespaces. Do not reuse
# a broader-scoped token here. Until that secret exists, this workflow is a
# no-op (warns once per run, does not fail).

on:
  schedule:
    - cron: "12 */6 * * *"
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Wake shutdown codespaces, let postStart run, put them back to sleep
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::CODESPACES_PAT is not set — skipping the codespace maintenance sweep. Add a repo secret scoped to just 'codespace' to enable it (see this workflow's header comment)."
            exit 0
          fi

          # Derived from the script, not duplicated as a guess: the actual
          # health-check timeout plus a 40s margin for the prune script and
          # container boot jitter. If devcontainer-poststart.sh's timeout
          # changes, this wait changes with it instead of silently going stale.
          healthcheck_timeout=$(grep -oE 'timeout [0-9]+s' scripts/devcontainer-poststart.sh | head -1 | grep -oE '[0-9]+')
          poststart_wait=$(( ${healthcheck_timeout:-20} + 40 ))

          repo="${{ github.repository }}"
          shutdown_codespaces=$(gh api "repos/${repo}/codespaces" --jq '.codespaces[] | select(.state == "Shutdown") | .name')

          if [ -z "$shutdown_codespaces" ]; then
            echo "No shutdown codespaces for ${repo} — nothing to sweep."
            exit 0
          fi

          for name in $shutdown_codespaces; do
            echo "=== waking $name ==="
            gh api -X POST "user/codespaces/${name}/start" >/dev/null

            state="unknown"
            for _ in $(seq 1 20); do
              state=$(gh api "user/codespaces/${name}" --jq '.state')
              [ "$state" = "Available" ] && break
              sleep 10
            done

            if [ "$state" != "Available" ]; then
              echo "::warning::${name} did not reach Available in time (last state: ${state}) — leaving it as-is rather than stopping mid-boot."
              continue
            fi

            sleep "$poststart_wait"

            echo "=== stopping $name ==="
            gh api -X POST "user/codespaces/${name}/stop" >/dev/null
          done
