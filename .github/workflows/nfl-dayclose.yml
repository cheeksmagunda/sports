name: nfl-dayclose

on:
  schedule:
    # 10:00 UTC: at least 1h past the latest observed NFL contest finalization
    # in the local Corpus C archive (a Monday-night slate finalizing ~08:50
    # UTC), and far enough from wnba-dayclose-verify's 07:00 UTC / corpus
    # backup's 06:00-06:43 UTC window that the two applications' scheduled
    # jobs never overlap.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: Slate date (YYYY-MM-DD) to grade; default is yesterday in US/Eastern
        required: false
        type: string
      catchup_window_days:
        description: How many days back to sweep for an ungraded frozen lineup
        required: false
        type: string
        default: "7"

permissions:
  contents: read

env:
  RESULTS_LABEL: nfl-ops-results
  GUARD_LABEL: nfl-ops-guard

concurrency:
  group: nfl-dayclose
  cancel-in-progress: false

jobs:
  dayclose:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      - name: Check for a slate inside the catch-up window
        id: gate
        # Fail open: a gate that cannot reach the public nflverse schedule
        # (network hiccup, upstream outage) must never silently swallow a
        # real day-close run. An unset has_slate output below is treated the
        # same as "true". skip_for_weekclose unset is treated as "false".
        continue-on-error: true
        run: |
          DAY_ARG=""
          if [ -n "${{ inputs.day }}" ]; then
            DAY_ARG="--day ${{ inputs.day }}"
          fi
          uv run --frozen --package nfl-oracle python nfl-oracle/scripts/nfl_dayclose_gate.py \
            $DAY_ARG \
            --window-days "${{ inputs.catchup_window_days || '7' }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Superseded by week-close on final slate day
        if: steps.gate.outputs.skip_for_weekclose == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          {
            echo "# NFL day-close superseded by week-close ($(date -u +%Y-%m-%dT%H:%MZ))"
            echo
            echo "- target_day: \`${{ steps.gate.outputs.target_day || '-' }}\`"
            echo "- skip_for_weekclose: true"
            echo
            echo "Final slate day of the NFL week is owned by nfl-weekclose (issue #165)."
          } | tee "$RUNNER_TEMP/dayclose-report.md"

      - name: Prepare TLS certificate
        if: >-
          steps.gate.outputs.skip_for_weekclose != 'true'
          && (steps.gate.outputs.has_slate != 'false' || github.event_name == 'workflow_dispatch')
        env:
          NFL_PG_SSL_ROOT_CERT: ${{ secrets.NFL_PG_SSL_ROOT_CERT }}
        run: |
          umask 077
          printf '%s' "$NFL_PG_SSL_ROOT_CERT" > "$RUNNER_TEMP/nfl_pg_root.crt"

      # Grading a day with a pending frozen lineup calls headers_or_capture(),
      # which falls back to a live Playwright Chromium capture whenever no
      # fresh cached token exists (always true on an ephemeral GHA runner).
      # The devcontainer and production Dockerfile both already install this
      # browser (system libs baked into their images); a stock ubuntu-latest
      # runner has neither, so --with-deps pulls the OS packages too. Without
      # this step, any day-close run that needs to grade a pending day fails
      # with playwright._impl._errors.Error ("Executable doesn't exist");
      # this is the confirmed root cause of the 2026-09-16 through
      # 2026-09-20 failure streak (issues #143 / #144).
      - name: Install Playwright Chromium
        if: >-
          steps.gate.outputs.skip_for_weekclose != 'true'
          && (steps.gate.outputs.has_slate != 'false' || github.event_name == 'workflow_dispatch')
        run: uv run --frozen --package nfl-oracle playwright install --with-deps chromium

      - name: Run day-close grading
        id: dayclose
        if: >-
          steps.gate.outputs.skip_for_weekclose != 'true'
          && (steps.gate.outputs.has_slate != 'false' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          NFL_DATABASE_URL: ${{ secrets.NFL_DAYCLOSE_DATABASE_URL }}
          REALSPORTS_STORAGE_STATE_B64GZ: ${{ secrets.REALSPORTS_STORAGE_STATE_B64GZ }}
          PGSSLROOTCERT: ${{ runner.temp }}/nfl_pg_root.crt
        run: |
          set -o pipefail
          if [ -z "$NFL_DATABASE_URL" ] || [ -z "$REALSPORTS_STORAGE_STATE_B64GZ" ]; then
            echo "not_configured: NFL_DAYCLOSE_DATABASE_URL and/or REALSPORTS_STORAGE_STATE_B64GZ secrets are unset" | tee "$RUNNER_TEMP/dayclose-report.md"
            exit 1
          fi
          DAY_ARG=""
          if [ -n "${{ inputs.day }}" ]; then
            DAY_ARG="--day ${{ inputs.day }}"
          fi
          uv run --frozen --package nfl-oracle nfl-pipeline \
            dayclose $DAY_ARG --catchup-window-days "${{ inputs.catchup_window_days || '7' }}" \
            | tee "$RUNNER_TEMP/dayclose-output.json"

      - name: Build results digest
        if: >-
          always()
          && steps.gate.outputs.skip_for_weekclose != 'true'
          && (steps.gate.outputs.has_slate != 'false' || github.event_name == 'workflow_dispatch')
        run: |
          {
            echo "# NFL day-close ($(date -u +%Y-%m-%dT%H:%MZ))"
            echo
            if [ -s "$RUNNER_TEMP/dayclose-output.json" ]; then
              echo '```json'
              cat "$RUNNER_TEMP/dayclose-output.json"
              echo '```'
            else
              echo "ALERT: day-close produced no output."
              cat "$RUNNER_TEMP/dayclose-report.md" 2>/dev/null || true
            fi
          } > "$RUNNER_TEMP/dayclose-report.md"

      - uses: ./.github/actions/dayclose-ledger
        if: >-
          always()
          && steps.gate.outputs.skip_for_weekclose != 'true'
          && (steps.gate.outputs.has_slate != 'false' || github.event_name == 'workflow_dispatch')
        with:
          results_label: ${{ env.RESULTS_LABEL }}
          results_title: "NFL results ledger"
          guard_label: ${{ env.GUARD_LABEL }}
          guard_title: "NFL production operations"
          report_path: ${{ runner.temp }}/dayclose-report.md
          should_escalate: ${{ steps.dayclose.outcome != 'success' && 'true' || 'false' }}
