version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # These ceilings mirror the workspace's tested compatibility ranges.
    # Without explicit ignores Dependabot probes incompatible major releases,
    # reports a failed check suite, and blocks Railway's CI-gated deploys.
    ignore:
      - dependency-name: "starlette"
        versions:
          - ">=1.0"
      - dependency-name: "redis"
        versions:
          - ">=6.0"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/wnba-oracle/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
