name: Set up locked Python workspace
description: Install the repository Python version, uv, and frozen workspace dependencies.
inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.11"
  uv-version:
    description: uv version to install.
    required: false
    default: "0.11.13"
  sync:
    description: Whether to install the frozen workspace.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ inputs.python-version }}

    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      with:
        enable-cache: true
        version: ${{ inputs.uv-version }}

    - name: Verify workspace lock
      if: inputs.sync == 'true'
      shell: bash
      run: uv lock --check

    - name: Install frozen workspace
      if: inputs.sync == 'true'
      shell: bash
      run: uv sync --frozen --all-packages --all-extras
