name: dayclose-ledger
description: >
  Report a scheduled operations job (day-close, week-close, watchdog, or
  guard) through the Actions run itself: post the markdown report to the
  job's own step summary, then fail the run when the caller says escalation
  is warranted, so the run shows red. This action never creates, comments
  on, labels, or closes a GitHub issue; issues are work items that a PR
  resolves, never job status (see root AGENTS.md, issue #442). Mechanical
  reporting only: the caller decides what counts as failure.

inputs:
  results_title:
    description: Heading used for this run's entry in the job step summary.
    required: true
  report_path:
    description: Path to the markdown report file posted to the job step summary.
    required: true
  should_escalate:
    description: >
      'true' fails the workflow run after the report is posted, so the run
      itself is the alert. 'false' leaves the run green.
    required: true

runs:
  using: composite
  steps:
    - name: Post results digest to the job summary
      shell: bash
      env:
        REPORT_PATH: ${{ inputs.report_path }}
        RESULTS_TITLE: ${{ inputs.results_title }}
      run: |
        {
          echo "## ${RESULTS_TITLE}"
          echo
          cat "$REPORT_PATH"
          echo
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fail the workflow after escalation
      if: inputs.should_escalate == 'true'
      shell: bash
      env:
        RESULTS_TITLE: ${{ inputs.results_title }}
      run: |
        echo "::error title=${RESULTS_TITLE}::Escalation warranted; the report is in this run's job summary."
        exit 1
