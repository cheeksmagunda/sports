name: dayclose-ledger
description: >
  Post a day-close (or backup) results digest to the job's own step summary,
  and track failure as a real incident issue: opened only on failure, closed
  automatically the next time the caller reports success. Results ledgers are
  permanent logs and must never live as a perpetually open/reused GitHub
  issue (see #283); incident issues are matched on the exact label AND title
  together so two unrelated callers sharing a label can never silently write
  into each other's issue. Mechanical GitHub plumbing only: the caller
  decides what counts as failure.

inputs:
  results_label:
    description: Deprecated, unused. Accepted so existing callers need no changes.
    required: false
  results_title:
    description: Heading used for this run's entry in the job step summary.
    required: true
  guard_label:
    description: Label for the failure-escalation incident issue.
    required: true
  guard_title:
    description: Exact title used to find, or create, the incident issue.
    required: true
  report_path:
    description: Path to a markdown report file for the summary and/or the incident issue.
    required: true
  should_escalate:
    description: >
      'true' to open/update the incident issue and fail the workflow.
      'false' also closes the incident issue if one is currently open.
    required: true

runs:
  using: composite
  steps:
    - name: Post results digest to the job summary
      shell: bash
      env:
        REPORT_PATH: ${{ inputs.report_path }}
        RESULTS_TITLE: ${{ inputs.results_title }}
      run: |
        {
          echo "## ${RESULTS_TITLE}"
          echo
          cat "$REPORT_PATH"
          echo
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Resolve or escalate the incident
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPORT_PATH: ${{ inputs.report_path }}
        GUARD_LABEL: ${{ inputs.guard_label }}
        GUARD_TITLE: ${{ inputs.guard_title }}
        SHOULD_ESCALATE: ${{ inputs.should_escalate }}
      run: |
        gh label create "$GUARD_LABEL" --color B60205 --description "Production operations incident" 2>/dev/null || true
        number=$(gh issue list --label "$GUARD_LABEL" --state open --json number,title \
          --jq --arg t "$GUARD_TITLE" '.[] | select(.title == $t) | .number' | head -n 1)
        if [ "$SHOULD_ESCALATE" = "true" ]; then
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$REPORT_PATH"
          else
            gh issue create --label "$GUARD_LABEL" --title "$GUARD_TITLE" --body-file "$REPORT_PATH"
          fi
        else
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Resolved: the next run reported success, as of $(date -u +'%F %T') UTC."
            gh issue close "$number"
          fi
        fi

    - name: Fail the workflow after escalation
      if: inputs.should_escalate == 'true'
      shell: bash
      run: exit 1
