<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#071018" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e8eef4" media="(prefers-color-scheme: light)" />
    <meta name="nhl-api-base" content="%VITE_API_URL%" />
    <meta name="description" content="NHL Oracle: five-card ordered slate recommendations for Real Sports." />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%230a6b8a'/%3E%3Cstop offset='100%25' stop-color='%23c4d4e0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%23071018'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='url(%23g)' stroke-width='2'/%3E%3Ctext x='50%25' y='52%25' dominant-baseline='central' text-anchor='middle' font-family='ui-sans-serif,system-ui,sans-serif' font-weight='800' font-size='11' fill='%23c4d4e0'%3ENHL%3C/text%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />

    <title>NHL Oracle</title>
  </head>
  <body>
    <div
      id="pre-hydration-shell"
      aria-hidden="true"
      style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:#071018;color:#7ec8e3;z-index:2000;"
    >
      <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true" id="pre-hydration-mark">
        <circle cx="28" cy="28" r="22" fill="none" stroke="#0a6b8a" stroke-width="3" />
        <circle cx="28" cy="28" r="14" fill="none" stroke="#c4d4e0" stroke-width="1.5" opacity="0.7" />
        <text x="50%" y="52%" dominant-baseline="central" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="800" font-size="12" fill="#c4d4e0">NHL</text>
      </svg>
      <span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#6b8499;">Loading NHL Oracle</span>
      <style>#pre-hydration-mark { animation: pre-spin 5s linear infinite; transform-origin: center; } @keyframes pre-spin { to { transform: rotate(360deg); } } @media (prefers-reduced-motion: reduce) { #pre-hydration-mark { animation: none; } }</style>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
