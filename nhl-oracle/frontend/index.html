<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1a6b7c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#7ec8d8" media="(prefers-color-scheme: dark)" />
    <meta name="nhl-api-base" content="%VITE_API_URL%" />
    <meta name="description" content="NHL Oracle: five-card ordered lineup shell. Hosted API wiring is staged." />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%231a6b7c'/%3E%3Cstop offset='100%25' stop-color='%23c5e8f0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='ui-sans-serif,system-ui,sans-serif' font-weight='800' font-size='16' fill='%23071018'%3EH%3C/text%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />

    <title>NHL Oracle</title>
  </head>
  <body>
    <div
      id="pre-hydration-shell"
      aria-hidden="true"
      style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:light-dark(#eef4f7,#071018);color:light-dark(#1a6b7c,#7ec8d8);z-index:2000;"
    >
      <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true" id="pre-hydration-mark">
        <defs>
          <linearGradient id="phg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1a6b7c" />
            <stop offset="100%" stop-color="#c5e8f0" />
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="52" height="52" rx="12" fill="url(#phg)" />
        <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="800" font-size="28" fill="#071018">H</text>
      </svg>
      <span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:light-dark(#5a6b75,#8a9aa5);">Loading the oracle</span>
      <style>#pre-hydration-mark { animation: pre-spin 4s linear infinite; transform-origin: center; } @keyframes pre-spin { to { transform: rotate(360deg); } } @media (prefers-reduced-motion: reduce) { #pre-hydration-mark { animation: none; } }</style>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
