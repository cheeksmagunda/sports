[project]
name = "wnba-oracle"
version = "0.1.0"
description = "Real Sports WNBA daily top-5 picker. Pre-tip ranker + lineup optimizer over the slate's player pool."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "cheeksmagunda" }]

dependencies = [
    "oracle-core==0.1.0",
    # Web + serving
    "fastapi>=0.120,<0.130",
    "starlette>=0.49.1,<1.0",
    "uvicorn[standard]>=0.32,<0.36",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # Storage
    "redis[hiredis]>=5.2,<6.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    # HTTP + resilience
    "httpx>=0.28,<0.30",
    "tenacity>=9.0,<10.0",
    "tzdata>=2024.2",
    # Logging / config
    "structlog>=24.4,<26.0",
    "pyyaml>=6.0.3",
    # Dataframes
    "polars>=1.16,<2.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=18.0,<24.0",
    "pandera[polars]>=0.21,<1.0",
    # ML stack. Exact pins on libs whose version influences pickled bytes
    # so the determinism gate (train twice, assert pickle SHA equality)
    # is meaningful. LightGBM RFC 6731.
    "numpy==2.2.6",
    "lightgbm==4.6.0",
    "scikit-learn>=1.5,<2.0",
    "scipy>=1.13,<2.0",
    # WNBA data sources
    "nba_api>=1.7,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<7.0",
    "playwright>=1.59.0",
]

[tool.uv.sources]
oracle-core = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "respx>=0.21,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "pip-audit>=2.10,<3.0",
    "types-pyyaml>=6.0,<7.0",
    "bandit>=1.7,<2.0",
]

[project.scripts]
# Operator surface: Job 2 (frozen lineup) runs via the scheduled cron path only.
# Manual fires go through scripts/manual_job{1,2}_fire.py from a dev machine.
oracle-job1 = "wnba_oracle.scheduler.job1:main"
oracle-job2 = "wnba_oracle.scheduler.job2:main"
oracle-cron = "wnba_oracle.scheduler.cron:main"
oracle-train = "wnba_oracle.train.cli:main"
oracle-rotate-check = "wnba_oracle.audit.rotation_cli:main"
oracle-backfill = "wnba_oracle.ingest.backfill:main"
oracle-placements = "wnba_oracle.scheduler.placements:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wnba_oracle"]

[tool.hatch.build.targets.wheel.force-include]
"src/wnba_oracle/train/models.yaml" = "wnba_oracle/train/models.yaml"

[tool.hatch.build.targets.sdist]
# The Python distribution is the backend artifact. Frontend dependencies and
# local build/test caches are built by their own entry point and must not make
# the backend source archive nondeterministic or enormous.
exclude = [
    "frontend/**",
    "**/.mypy_cache/**",
    "**/.pytest_cache/**",
    "**/.ruff_cache/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-m 'not contract and not integration'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring postgres/redis",
    "training: marks tests that train models against the corpus",
    "contract: external-API schema contract tests (network). Default excludes them; nightly runs `pytest -m contract` to catch upstream schema drift before a fire.",
]
filterwarnings = [
    # Surface DeprecationWarnings by default so numpy 2 / pandas 3 rot
    # shows up early. Ignore known third-party noise only, with a note.
    "default::DeprecationWarning",
    # pandas 2.x emits DeprecationWarning through pyarrow's date handling
    # in Polars->pandas bridge code we don't own.
    "ignore:.*Passing a BlockManager.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [
    "frontend/",
    ".venv/",
    "migrations/versions/",
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "W", "B", "C4", "UP", "SIM", "RUF",
    "C90", # Keep new functions below Radon's E-rated complexity band.
    "TCH",  # type-checking-only imports
    "PT",   # pytest style
    "RET",  # return-value hygiene
    "PIE",  # misc anti-patterns
    "TID",  # tidy imports
    "PERF", # obvious perf antipatterns
    "ARG",  # unused function args
]
ignore = [
    "E501", "B008", "B905", "RUF001", "RUF002", "RUF003", "SIM105",
    # PT011: broad `pytest.raises(Exception)` is fine in fuzz-style tests.
    "PT011",
    # ARG002: unused method args are common in FastAPI dep-injection sigs.
    "ARG002",
    # RET504: unnecessary assignment before return often aids debugging.
    "RET504",
    # TC001-3: moving imports under TYPE_CHECKING is negligible perf
    # for meaningful diff churn on a small project. Skip.
    "TC001", "TC002", "TC003",
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to compose asserts and take handler args they don't use
# (httpx respx handlers require the `request` positional even when ignored).
# PERF401/PERF102 in tests is churn-for-churn.
"tests/**" = ["PT018", "PT019", "ARG001", "PT017", "PERF401", "PERF102"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["frontend/", "migrations/versions/"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "frontend"]
skips = ["B101", "B608"]
