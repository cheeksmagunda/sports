name: corpus-backup

# Nightly off-platform backup of the irreplaceable scraped corpus
# (slate_labels + contest_leaderboards) from prod Postgres to the `backups`
# branch. Runs ~40 min after the dayclose cron (06:00 UTC) refreshes Postgres.
# Commits land on `backups`, never `main`, so backups do not retrigger Railway
# deploys. Restore: `git checkout backups -- data/backups` then load the CSVs
# (or use scripts/backup_corpus.py's source tables).

on:
  schedule:
    - cron: "43 6 * * *" # 06:43 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: corpus-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backups branch
        uses: actions/checkout@v4
        with:
          ref: backups
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install "sqlalchemy>=2,<3" "psycopg[binary]>=3" pandas

      - name: Write TLS root cert
        run: printf '%s' "${{ secrets.PG_SSL_ROOT_CERT }}" > "$RUNNER_TEMP/pg_root.crt"

      - name: Run backup
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PGSSLROOTCERT: ${{ runner.temp }}/pg_root.crt
        run: python scripts/backup_corpus.py

      - name: Commit snapshot
        run: |
          git config user.name "wnba-oracle-bot"
          git config user.email "noreply@github.com"
          git add -f data/backups/slate_labels.csv data/backups/contest_leaderboards.csv data/backups/manifest.json
          if git diff --cached --quiet; then
            echo "no corpus changes; skipping commit"
          else
            git commit -m "backup: corpus snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin backups
          fi
