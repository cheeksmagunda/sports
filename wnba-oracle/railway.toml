# Project-wide Railway defaults. NO per-service blocks (Railway 2026
# `railway.toml` does not support [services.<name>]). Per-service overrides
# (healthcheckPath, preDeployCommand, startCommand) live on the service in
# the Railway dashboard or via GraphQL, not here. See mlb-oracle's
# 2026-05-07 to 2026-05-18 silent-cron regression for the cautionary tale.
# Railway services use the sports repository root as their build context and
# this file as the config-as-code path.

[build]
builder = "DOCKERFILE"
dockerfilePath = "wnba-oracle/Dockerfile"
