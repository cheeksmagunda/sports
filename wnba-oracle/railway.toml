# Project-wide Railway defaults. NO per-service blocks (Railway 2026
# `railway.toml` does not support [services.<name>]). Per-service overrides
# (healthcheckPath, preDeployCommand, startCommand) live on the service in
# the Railway dashboard or via GraphQL, not here. See mlb-oracle's
# 2026-05-07 to 2026-05-18 silent-cron regression for the cautionary tale.
# Railway services use the sports repository root as their build context and
# this file as the config-as-code path.
#
# Builder must stay DOCKERFILE (wnba-oracle/Dockerfile). A plain
# `railway redeploy` (image reuse / reason=redeploy) of an older deployment
# whose serviceManifest.builder was RAILPACK re-runs Railpack/mise and fails
# with "No interpreter found for Python >=3.11, <3.13" because
# UV_PYTHON_DOWNLOADS=never (issue #279). Recover with:
#   scripts/codespace-railway-env -- railway redeploy --service <name> --from-source -y
# or the workflow's serviceInstanceDeployV2(commitSha=...) path, never an
# image-reuse redeploy of a FAILED Railpack build.

[build]
builder = "DOCKERFILE"
dockerfilePath = "wnba-oracle/Dockerfile"
