<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NFL Oracle</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><p class="eyebrow">SPORTS ORACLE</p><h1>NFL Oracle</h1><p>Five picks. Your call.</p></header>
<form id="day-form"><label for="day">Slate date (Central time)</label><div class="controls"><input id="day" type="date" required><button type="submit">View picks</button><button id="refresh" type="button">Refresh</button></div></form>
<section aria-live="polite" aria-atomic="true"><h2 id="status">Loading picks</h2><p id="message">Checking the latest saved lineup.</p><p id="timing"></p></section>
<ol id="picks" aria-label="Five recommended picks"></ol><p id="provenance"></p>
<footer>Recommendations only. Entries are never submitted automatically. Pick order reflects the saved slot multipliers.</footer></main></body></html>
