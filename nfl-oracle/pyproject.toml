[project]
name = "nfl-oracle"
version = "0.1.0"
description = "Real Sports NFL corpus ingest and five-card research application."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Ben Oracle" }]

dependencies = [
    "oracle-core==0.1.0",
    "httpx>=0.28,<0.30",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "structlog>=24.4,<27.0",
    "playwright>=1.59.0",
    "nflreadpy>=0.1,<1",
    "scipy>=1.14,<2",
]

[tool.uv.sources]
oracle-core = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "respx>=0.21,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "uvicorn[standard]>=0.32,<1.0",
]
serve = [
    "uvicorn[standard]>=0.32,<1.0",
]

[project.scripts]
nfl-corpus-g-backfill = "nfl_oracle.ingest.backfill:main"
nfl-value-baselines = "nfl_oracle.baselines.cli:main"
nfl-strategy-schema = "nfl_oracle.strategy.cli:main"
nfl-research-serve = "nfl_oracle.service.cli:main"
nfl-provider-status = "nfl_oracle.providers.cli:main"
nfl-contest-dry-run = "nfl_oracle.strategy.dry_run_cli:main"
nfl-walk-forward-report = "nfl_oracle.baselines.eval_cli:main"
nfl-pipeline = "nfl_oracle.recommendations.cli:main"
nfl-contest-backfill = "nfl_oracle.contests.cli:main"
nfl-boost-watch = "nfl_oracle.contests.boost_watch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_oracle"]

[tool.hatch.build.targets.wheel.force-include]
"frontend" = "nfl_oracle/recommendations/frontend"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["nfl_oracle"]
mypy_path = ["src"]
