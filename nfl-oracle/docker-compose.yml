# Local observation-only nfl-oracle research API.
# Image/service name: nfl-oracle-local
# No secrets / env_file. Not Railway. Do not deploy to production.
#
#   make -C nfl-oracle docker-research-smoke
#   docker compose -f nfl-oracle/docker-compose.yml up --build

name: nfl-oracle-local

services:
  research:
    build:
      context: ..
      dockerfile: nfl-oracle/Dockerfile
    image: nfl-oracle-local:local
    container_name: nfl-oracle-local
    ports:
      - "8088:8088"
    environment:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NFL_ORACLE_MODE: research_local
    # Intentionally no env_file and no secret mounts (scraper/storage_state excluded).
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s
    restart: "no"
